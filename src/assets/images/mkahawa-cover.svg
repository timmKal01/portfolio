<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="30%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#e8552a" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#e8552a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#1b1512" />
  <rect width="800" height="280" fill="url(#glow)" />

  <!-- header -->
  <line x1="0" y1="64" x2="800" y2="64" stroke="#3a2f28" stroke-width="1" />
  <text x="32" y="40" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" letter-spacing="2" fill="#f3e9d8">MKAHAWA</text>
  <rect x="642" y="20" width="126" height="30" rx="2" fill="none" stroke="#5a483d" stroke-width="1.2" />
  <text x="705" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#f3e9d8">Reserve a table</text>

  <!-- eyebrow -->
  <text x="32" y="140" font-family="Georgia, monospace" font-size="13" letter-spacing="1" fill="#c98a5e">Kilimani, Nairobi</text>

  <!-- headline -->
  <text x="30" y="205" font-family="Fraunces, Georgia, serif" font-size="52" fill="#f3e9d8">Nairobi,</text>
  <text x="30" y="265" font-family="Fraunces, Georgia, serif" font-size="52" fill="#f3e9d8">over coals.</text>

  <!-- lede -->
  <text x="32" y="308" font-family="Georgia, serif" font-size="15" fill="#cbb8a8">Highland beef, dry-aged in-house and finished over indigenous</text>
  <text x="32" y="330" font-family="Georgia, serif" font-size="15" fill="#cbb8a8">hardwood charcoal. No gas line in the building.</text>

  <!-- buttons -->
  <rect x="32" y="360" width="164" height="46" fill="#e8552a" />
  <text x="114" y="389" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#1b1512">Reserve a table</text>

  <text x="226" y="389" font-family="Georgia, serif" font-size="15" fill="#f3e9d8" text-decoration="underline">View the menu</text>

  <!-- divider -->
  <line x1="32" y1="440" x2="500" y2="440" stroke="#e8552a" stroke-opacity="0.4" stroke-width="1" />
</svg>
